{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-6 py-8">

  <nav class="flex items-center gap-2 text-sm mb-3">
    <a href="/dashboard" class="text-slate-500 hover:text-slate-700">Inicio</a>
    <span class="text-slate-300">›</span>
    <a href="/admin/usuarios" class="text-slate-500 hover:text-slate-700">Usuarios</a>
    <span class="text-slate-300">›</span>
    <span class="text-slate-800 font-medium">{{ titulo }}</span>
  </nav>
  <h1 class="text-2xl font-bold text-slate-900 mb-6">{{ titulo }}</h1>

  <form method="post"
        action="{% if accion == 'crear' %}/admin/usuarios{% else %}/admin/usuarios/{{ u.id }}{% endif %}"
        class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-5">

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5" for="nombre">Nombre completo</label>
      <input type="text" name="nombre" id="nombre" required value="{{ u.nombre if u else '' }}"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5" for="email">Email</label>
      <input type="email" name="email" id="email" required value="{{ u.email if u else '' }}"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5" for="rol">Rol</label>
      <select name="rol" id="rol" required
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
        {% for r in ["Administrador", "Directivo", "Secretaria", "Docente"] %}
          <option value="{{ r }}" {% if u and u.rol == r %}selected{% endif %}>{{ r }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5" for="password">
        Contraseña
        {% if accion == 'editar' %}<span class="text-xs text-slate-500">(dejá en blanco para no cambiarla)</span>{% endif %}
      </label>
      <input type="password" name="password" id="password" {% if accion == 'crear' %}required{% endif %}
             class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
    </div>

    <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
      <a href="/admin/usuarios" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</a>
      <button type="submit" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium rounded-lg shadow-sm">
        {% if accion == 'crear' %}Crear usuario{% else %}Guardar cambios{% endif %}
      </button>
    </div>
  </form>

</div>
{% endblock %}
