{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="min-h-[80vh] bg-gradient-to-br from-slate-100 to-blue-100 flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200">

      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl mb-4 shadow-md">
          <span class="text-white font-bold text-3xl">L</span>
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Libretas<span class="text-blue-700">.py</span></h1>
        <p class="text-sm text-slate-500 mt-1">Iniciá sesión para continuar</p>
      </div>

      {% if error %}
        <div class="mb-4 px-4 py-3 rounded-lg bg-rose-50 border border-rose-200 text-sm text-rose-700">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="email">Email</label>
          <input type="email" name="email" id="email" required
                 value="gnaveda@novalido.com"
                 class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="password">Contraseña</label>
          <input type="password" name="password" id="password" required
                 class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
        </div>

        <button type="submit"
                class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2.5 rounded-lg shadow-sm">
          Iniciar sesión
        </button>
      </form>

      <p class="text-xs text-slate-500 mt-6 text-center">
        Demo: <code class="bg-slate-100 px-1 rounded">gnaveda@novalido.com</code> / <code class="bg-slate-100 px-1 rounded">admin123</code>
      </p>
    </div>
    <p class="text-center text-xs text-slate-500 mt-6">Sistema institucional — uso restringido al personal autorizado</p>
  </div>
</div>
{% endblock %}
