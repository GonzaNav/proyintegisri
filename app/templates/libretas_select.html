{% extends "base.html" %}
{% block title %}Generar libreta{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-6 py-8">

  <nav class="flex items-center gap-2 text-sm">
    <a href="/dashboard" class="text-slate-500 hover:text-slate-700">Inicio</a>
    <span class="text-slate-300">›</span>
    <span class="text-slate-800 font-medium">Generar libreta</span>
  </nav>

  <h1 class="text-2xl font-bold text-slate-900 mt-3">Generar libreta de calificaciones</h1>
  <p class="text-sm text-slate-500 mt-1 mb-6">Seleccioná curso, período y alumno para visualizar la libreta.</p>

  <form method="post" action="/libretas/preview" class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-5">

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5" for="curso_id">Curso</label>
      <select name="curso_id" id="curso_id" required onchange="cargarAlumnos(this.value)"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
        <option value="">Seleccionar curso...</option>
        {% for c in cursos %}
          <option value="{{ c.id }}" {% if curso_id_sel == c.id %}selected{% endif %}>{{ c.grado }} {{ c.seccion }} — Docente: {{ c.docente }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-2">Período</label>
      <div class="grid grid-cols-2 gap-3">
        {% for p in periodos %}
        <label class="flex items-center gap-2 px-3 py-2 border border-slate-300 rounded-lg cursor-pointer hover:bg-slate-50">
          <input type="radio" name="periodo" value="{{ p }}" {% if loop.index == 1 %}required{% endif %}>
          <span class="text-sm">{{ p }}</span>
        </label>
        {% endfor %}
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5" for="alumno_id">Alumno</label>
      <select name="alumno_id" id="alumno_id" required
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
        {% if alumnos_curso %}
          <option value="">Seleccionar alumno...</option>
          {% for a in alumnos_curso %}
            <option value="{{ a.id }}" {% if alumno_id_sel == a.id %}selected{% endif %}>{{ a.apellido }}, {{ a.nombre }} - Legajo {{ a.legajo }}</option>
          {% endfor %}
        {% else %}
          <option value="">Primero seleccioná un curso...</option>
        {% endif %}
      </select>
    </div>

    <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
      <a href="/dashboard" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</a>
      <button type="submit" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium rounded-lg shadow-sm">
        Vista previa →
      </button>
    </div>
  </form>
</div>

<script>
async function cargarAlumnos(cursoId) {
  const select = document.getElementById("alumno_id");
  if (!cursoId) {
    select.innerHTML = '<option value="">Primero seleccioná un curso...</option>';
    return;
  }
  const res = await fetch("/libretas/alumnos/" + cursoId);
  const alumnos = await res.json();
  select.innerHTML = '<option value="">Seleccionar alumno...</option>' +
    alumnos.map(a => `<option value="${a.id}">${a.texto}</option>`).join("");
}
</script>
{% endblock %}
